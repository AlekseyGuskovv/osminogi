name: Cyber Garden Security
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Check out PR inputs
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .garden-head
          persist-credentials: false
      - name: Execute the saved security graph
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/garden-reports"
          head_repo=.
          if [[ -n "$PR_HEAD_SHA" ]]; then
            head_repo=.garden-head
          fi
          project=examples/kotlin-project
          if ! git -C "$head_repo" cat-file -e "HEAD:$project/build.gradle.kts"; then
            echo "::error file=$project/build.gradle.kts::The checked commit must contain the Cyber Garden training project."
            exit 2
          fi
          git -C "$head_repo" archive --format=zip --output="$RUNNER_TEMP/head.zip" "HEAD:$project"
          args=()
          if [[ -n "$PR_HEAD_SHA" ]] && git cat-file -e "HEAD:$project/build.gradle.kts"; then
            git archive --format=zip --output="$RUNNER_TEMP/base.zip" "HEAD:$project"
            args+=(--base "$RUNNER_TEMP/base.zip")
          fi
          python3 -m backend.app.analysis.scan "$RUNNER_TEMP/head.zip" "${args[@]}" \
            --graph docs/ci-workflow.json \
            --report-json "$RUNNER_TEMP/garden-reports/findings.json" \
            --report-markdown "$RUNNER_TEMP/garden-reports/findings.md"
      - name: Upload JSON and Markdown reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyber-garden-reports
          path: ${{ runner.temp }}/garden-reports/
          if-no-files-found: ignore
