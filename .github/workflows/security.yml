name: Cyber Garden Security
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute the saved security graph
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/garden-reports"
          git archive --format=zip --output="$RUNNER_TEMP/head.zip" "$HEAD_SHA:examples/kotlin-project"
          args=()
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA:examples/kotlin-project"; then
            git archive --format=zip --output="$RUNNER_TEMP/base.zip" "$BASE_SHA:examples/kotlin-project"
            args+=(--base "$RUNNER_TEMP/base.zip")
          fi
          python3 -m backend.app.analysis.scan "$RUNNER_TEMP/head.zip" "${args[@]}" \
            --graph docs/ci-workflow.json \
            --report-json "$RUNNER_TEMP/garden-reports/findings.json" \
            --report-markdown "$RUNNER_TEMP/garden-reports/findings.md"
      - name: Upload JSON and Markdown reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyber-garden-reports
          path: ${{ runner.temp }}/garden-reports/
          if-no-files-found: ignore