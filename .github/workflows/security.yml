name: Cyber Garden Security
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze the training project as source only
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/head.zip" "$HEAD_SHA:examples/kotlin-project"
          args=()
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA:examples/kotlin-project"; then
            git archive --format=zip --output="$RUNNER_TEMP/base.zip" "$BASE_SHA:examples/kotlin-project"
            args+=(--base "$RUNNER_TEMP/base.zip")
          fi
          python3 -m backend.app.analysis.scan "$RUNNER_TEMP/head.zip" "${args[@]}"
