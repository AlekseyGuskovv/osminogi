<!doctype html>
<html lang="ru" data-theme="prism-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        if (localStorage.getItem('cyber-garden-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch {}
    </script>
    <style>html { background: #0b1014; } html[data-theme="prism-light"] { background: #f5f9f3; }</style>
    <title>Cyber Garden</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
